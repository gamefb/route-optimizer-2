[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = [
    "E501",  # line length is the formatter's job; long strings and comments are left as written
    "B008",  # Depends(...) as an argument default is how FastAPI is meant to be used
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
