site_name: Route Planner
site_description: How to set up and use Route Planner.
# Where the built pages will live. It only matters for the "page not found" page, which has to load its
# styles from the right place: /help/ inside the app, the project's address on GitHub Pages.
site_url: !ENV SITE_URL
docs_dir: docs
theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: false
  prev_next_buttons_location: bottom
  highlightjs: false # it would be fetched from a CDN; these pages should work with no internet
markdown_extensions:
  - admonition
  - toc:
      permalink: true
exclude_docs: |
  requirements.txt
validation: # with "mkdocs build --strict", any of these fails the build
  links:
    not_found: warn
    anchors: warn # a link to a heading that does not exist
    absolute_links: warn
nav:
  - Home: index.md
  - Installation:
      - Running locally: install/local.md
      - Running via Docker: install/docker.md
      - Initial setup: install/first-time.md
      - Migrating between local and Docker: install/moving.md
      - Uninstalling: install/uninstall.md
  - Daily workflow:
      - 1. Entering addresses: daily/paste.md
      - 2. Reviewing addresses: daily/review.md
      - 3. Selecting drivers and options: daily/drivers-options.md
      - 4. Building routes: daily/routes.md
      - 5. Adjusting routes: daily/adjust.md
      - 6. Exporting: daily/export.md
  - Reference:
      - Drivers: reference/drivers.md
      - Stop assignment: reference/assignment.md
      - Addresses and import: reference/addresses.md
      - Settings: reference/settings.md
      - Backup and restore: reference/backup.md
      - Security and privacy: reference/security.md
      - Troubleshooting: reference/troubleshooting.md
